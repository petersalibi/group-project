<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loss Landscape Viewer</title>
    <style>
    html,body{height:100%;margin:0}
    #container{width:100%;height:100%}
    .ui{position:absolute;left:10px;top:10px;z-index:10;background:rgba(255,255,255,0.9);padding:8px;border-radius:6px}
    </style>
</head>
    <body>
    <div id="container"></div>
        <div class="ui">
            <label for="fileSelect">Choose surface:</label>
            <select id="fileSelect">
                <option value="loss_filt.json">Filterwise Normalised</option>
                <option value="loss_rand.json">Random Directions</option>
            </select>
            <label for="scale">Z scale</label>
            <input id="scale" type="range" min="0.0001" max="5" step="0.1" value="1">
        </div>
    <script type="importmap">
    {
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>
    <script type="module" src="./landscape.js"></script>
    </body>
</html>
